version: '3.8'

services:
  facebook-server:
    build:
      context: ./facebook-server
      dockerfile: Dockerfile
    ports:
      - "${FACEBOOK_PORT:-3001}:3001"
    env_file:
      - ./facebook-server/.env
    volumes:
      - ./facebook-server:/app
    depends_on:
      - neon-proxy

  messenger-server:
    build:
      context: ./messenger-server
      dockerfile: Dockerfile
    ports:
      - "${MESSENGER_PORT:-8080}:8080"
    env_file:
      - ./messenger-server/.env
    volumes:
      - ./messenger-server:/app
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    env_file:
      - ./frontend/.env.local
    volumes:
      - ./frontend:/app
    depends_on:
      - facebook-server
      - messenger-server

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  neon-proxy:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=facebook
    volumes:
      - neon_data:/var/lib/postgresql/data

volumes:
  mongodb_data:
  neon_data: